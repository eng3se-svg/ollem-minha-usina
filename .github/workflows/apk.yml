# Gera o APK de TESTE do app "Ollem - Minha usina" (Android, modo demonstração, sem servidor).
# Como usar: aba Actions → "APK de teste" → Run workflow. No fim, baixe o APK em "Artifacts".
# Aceita duas formas de código: a pasta app/ do repositório (em qualquer subpasta) ou um arquivo
# app-teste.zip na raiz (tem prioridade, para quem atualiza o código pelo navegador).
name: APK de teste

on:
  workflow_dispatch:
  push:
    paths: ['app-teste.zip', '**/app/src/**', '**/app/package.json', '.github/workflows/apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Achar o código do app
        id: app
        run: |
          if [ -f app-teste.zip ]; then
            mkdir -p _app && unzip -q app-teste.zip -d _app
            DIR=$(dirname "$(find _app -name capacitor.config.json -not -path '*/node_modules/*' | head -1)")
          else
            DIR=$(dirname "$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)")
          fi
          test -n "$DIR" && test -f "$DIR/package.json" || { echo "Não achei a pasta do app (capacitor.config.json)"; exit 1; }
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Pasta do app: $DIR"

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Montar o app (Vue → dist)
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Criar o projeto Android, ícone e abertura
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          rm -rf android
          npx cap add android
          npm run apk:icones
          npx cap sync android

      - name: Versão do APK
        id: ver
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$V-teste\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Gerar o APK (debug, para teste)
        working-directory: ${{ steps.app.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/saida"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/saida/Ollem-Minha-usina-${{ steps.ver.outputs.v }}-teste.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Ollem-Minha-usina-${{ steps.ver.outputs.v }}-teste-apk
          path: saida/*.apk
          retention-days: 30
